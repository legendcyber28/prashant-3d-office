<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prashant's Office - 3D Portfolio</title>
<meta name="description" content="Walk through Prashant Katheriya's virtual 3D office - projects, skills, creator studio and contact, as an explorable isometric world.">
<style>
  :root{
    --bg:#10151b; --panel:#171e26; --panel-2:#1e2732; --ink:#f2efe9; --ink-2:#a9b4bf;
    --accent:#e8825a; --accent-2:#7fd4c1; --hair:#2a3441; --chip:#222c38;
    --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  body.light{
    --bg:#f3ede4; --panel:#fffdf9; --panel-2:#f4efe6; --ink:#26221f; --ink-2:#6f675f;
    --accent:#d96f3f; --accent-2:#3d8f7c; --hair:#e6ded2; --chip:#efe8dc;
    --shadow:0 12px 34px rgba(80,60,40,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:background .35s}
  #scene{position:fixed;inset:0;display:block;touch-action:none}
  /* HUD */
  .hud{position:fixed;z-index:10;pointer-events:none}
  .hud>*{pointer-events:auto}
  #brand{top:max(12px,env(safe-area-inset-top));left:14px;display:flex;align-items:center;gap:10px}
  #brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;color:#10151b;font-size:15px;box-shadow:var(--shadow)}
  #brand .name{font-weight:700;font-size:15px;letter-spacing:.4px;line-height:1.15}
  #brand .sub{font-size:11px;color:var(--ink-2)}
  #topbtns{top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--hair);background:var(--panel);color:var(--ink);font-size:17px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
  .iconbtn:active{transform:scale(.92)}
  #hint{left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--hair);color:var(--ink-2);padding:7px 14px;border-radius:999px;font-size:12px;white-space:nowrap;box-shadow:var(--shadow);transition:opacity .5s}
  /* Tour pill */
  #tour{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:width .25s;width:170px}
  #tour.open{width:min(320px,92vw)}
  #tourhead{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none}
  #tourhead .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  #tourhead b{font-size:13px;flex:1}
  #tourhead span{font-size:11px;color:var(--ink-2)}
  #tourlist{max-height:0;transition:max-height .3s}
  #tour.open #tourlist{max-height:260px}
  .touritem{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--hair);cursor:pointer}
  .touritem .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-size:10px;color:#10151b;flex:none}
  .touritem.done{color:var(--ink)}
  .touritem.done .box{background:var(--accent-2);border-color:var(--accent-2)}
  /* Zone card */
  #cardwrap{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(8,10,14,.35);backdrop-filter:blur(2px)}
  #cardwrap.show{display:flex}
  #card{width:min(430px,100vw);background:var(--panel);border:1px solid var(--hair);border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .28s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:700px){#cardwrap{align-items:center}#card{border-radius:24px;padding-bottom:22px}}
  #card .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);background:var(--chip);padding:4px 10px;border-radius:999px;margin-bottom:9px}
  #card h2{font-size:21px;margin-bottom:6px;letter-spacing:-.01em}
  #card p{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin-bottom:12px}
  #card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  #card .chip{font-size:11.5px;background:var(--chip);border:1px solid var(--hair);color:var(--ink);padding:5px 10px;border-radius:999px}
  #card .links{display:flex;flex-wrap:wrap;gap:8px}
  #card a.btn{flex:1;min-width:120px;text-align:center;text-decoration:none;font-size:13.5px;font-weight:700;padding:11px 14px;border-radius:13px;transition:transform .15s}
  #card a.btn:active{transform:scale(.96)}
  #card a.primary{background:var(--accent);color:#10151b}
  #card a.ghost{border:1px solid var(--hair);color:var(--ink);background:var(--panel-2)}
  #cardclose{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:10px;border:1px solid var(--hair);background:var(--panel-2);color:var(--ink-2);font-size:14px;cursor:pointer}
  #card{position:relative}
  /* Loader */
  #loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;transition:opacity .5s}
  #loader .ring{width:44px;height:44px;border-radius:50%;border:3px solid var(--hair);border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{font-size:13px;color:var(--ink-2)}
  /* Simple view */
  #simple{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:24px 18px 60px;display:none}
  #simple.show{display:block}
  #simple h1{font-size:24px;margin:8px 0 4px}
  #simple .sub{color:var(--ink-2);font-size:13px;margin-bottom:18px}
  #simple section{background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:16px;margin-bottom:12px}
  #simple h3{font-size:15px;margin-bottom:6px;color:var(--accent)}
  #simple p,#simple li{font-size:13.5px;color:var(--ink-2);line-height:1.55}
  #simple a{color:var(--accent-2);word-break:break-all}
  #simple ul{padding-left:18px}
  #closesimple{position:sticky;top:0;float:right}
  .fadeout{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud" id="brand"><div class="logo">PK</div><div><div class="name">PRASHANT'S OFFICE</div><div class="sub">a walk-through portfolio</div></div></div>
<div class="hud" id="topbtns">
  <button class="iconbtn" id="themebtn" title="Theme" aria-label="Toggle theme">☀️</button>
  <button class="iconbtn" id="simplebtn" title="Simple view" aria-label="Simple view">☰</button>
</div>
<div class="hud" id="hint">Tap anywhere on the floor to walk →</div>

<div class="hud" id="tour">
  <div id="tourhead"><span class="dot"></span><b>Office tour</b><span id="tourcount">0 / 6</span></div>
  <div id="tourlist"></div>
</div>

<div id="cardwrap">
  <div id="card">
    <button id="cardclose" aria-label="Close">✕</button>
    <span class="tag" id="cardtag"></span>
    <h2 id="cardtitle"></h2>
    <p id="cardtext"></p>
    <div class="chips" id="cardchips"></div>
    <div class="links" id="cardlinks"></div>
  </div>
</div>

<div id="loader"><div class="ring"></div><p>Building the office…</p></div>
<div id="simple"></div>

<script src="three.min.js"></script>
<script src="main.js"></script>
</body>
</html>
